<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realm Clash - 2D Tactical Kingdom & AI War</title>
  <meta name="description" content="A 2D strategic base builder and real-time tactical AI combat game inspired by Clash of Clans.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-container">

    <!-- VILLAGE UI LAYER -->
    <div id="village-ui-layer" class="ui-layer">
      
      <!-- Top Resource Bar -->
      <header id="village-top-bar">
        <div class="brand-title">⚔️ REALM CLASH</div>

        <div class="resource-pill-group">
          <div class="res-pill gold-pill">
            <span class="res-icon">💰</span>
            <span id="hud-gold" class="res-val">2,500 / 10,000</span>
          </div>
          <div class="res-pill elixir-pill">
            <span class="res-icon">🧪</span>
            <span id="hud-elixir" class="res-val">2,500 / 10,000</span>
          </div>
          <div class="res-pill gems-pill">
            <span class="res-icon">💎</span>
            <span id="hud-gems" class="res-val">50</span>
          </div>
          <div class="res-pill army-pill">
            <span class="res-icon">⛺</span>
            <span id="hud-army-count" class="res-val">15 / 50</span>
          </div>
        </div>
      </header>

      <!-- Bottom Action Toolbar -->
      <footer id="village-bottom-bar">
        <button id="btn-open-shop" class="btn-clash btn-shop">
          <span class="btn-icon">🛠️</span>
          <span>Shop</span>
        </button>
        <button id="btn-open-train" class="btn-clash btn-train-army">
          <span class="btn-icon">⚔️</span>
          <span>Train Army</span>
        </button>
        <button id="btn-start-attack" class="btn-clash btn-attack">
          <span class="btn-icon">💥</span>
          <span>ATTACK!</span>
        </button>
      </footer>

      <!-- Building Inspector Drawer -->
      <div id="building-inspector" class="inspector-drawer" style="display: none;">
        <div class="inspector-header">
          <h3 id="inspector-title">Town Hall (Lvl 1)</h3>
          <button id="btn-close-inspector" class="btn-icon-sm">✕</button>
        </div>
        <p id="inspector-desc">The central hub of your village.</p>
        <div id="inspector-hp" class="inspector-stat">HP: 1500 / 1500</div>
      </div>
    </div>

    <!-- BATTLE UI LAYER -->
    <div id="battle-ui-layer" class="ui-layer" style="display: none;">
      
      <!-- Top Battle HUD -->
      <header id="battle-top-bar">
        <div class="battle-destruction-panel">
          <div class="destruction-label">DESTRUCTION</div>
          <div id="battle-destruction-val" class="destruction-val">0%</div>
          <div class="progress-track">
            <div id="battle-destruction-bar" class="progress-fill" style="width: 0%;"></div>
          </div>
          <div id="battle-stars" class="stars-display">☆☆☆</div>
        </div>

        <div class="battle-stats-group">
          <div class="battle-timer-box">
            <span>⏱️</span>
            <span id="battle-timer">03:00</span>
          </div>
          <div class="loot-stolen-box">
            <span>💰 <strong id="battle-stolen-gold">+0</strong></span>
            <span style="margin-left: 8px;">🧪 <strong id="battle-stolen-elixir">+0</strong></span>
          </div>
        </div>

        <button id="btn-surrender" class="btn-danger">Surrender</button>
      </header>

      <!-- Bottom Troop Deployment Deck -->
      <footer id="battle-bottom-bar">
        <div id="battle-troop-deck" class="deck-container"></div>
      </footer>
    </div>

    <!-- Viewport Canvas -->
    <main id="game-viewport">
      <canvas id="game-canvas"></canvas>
    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Building Shop Modal -->
    <dialog id="shop-dialog" closedby="any">
      <div class="dialog-header">
        <h2 class="dialog-title">Village Building Catalog</h2>
        <form method="dialog"><button class="btn-icon-sm" type="submit">✕</button></form>
      </div>
      <div class="dialog-body">
        <div id="shop-items-grid" class="shop-grid"></div>
      </div>
    </dialog>

    <!-- Troop Training Modal -->
    <dialog id="train-dialog" closedby="any">
      <div class="dialog-header">
        <h2 class="dialog-title">Barracks Army Training</h2>
        <form method="dialog"><button class="btn-icon-sm" type="submit">✕</button></form>
      </div>
      <div class="dialog-body">
        <div id="train-troops-grid" class="train-grid"></div>
      </div>
    </dialog>

    <!-- Battle Report Modal -->
    <dialog id="battle-report-dialog" closedby="any">
      <div class="dialog-header" style="justify-content: center;">
        <h2 id="report-title" class="dialog-title">VICTORY RAID!</h2>
      </div>
      <div class="dialog-body" style="text-align: center;">
        <div id="report-stars" class="victory-stars">★★★</div>
        <h3 id="report-destruction" style="margin: 12px 0;">100% Destruction</h3>
        <div class="victory-loot-box">
          <div id="report-gold" class="loot-item">💰 +5,000</div>
          <div id="report-elixir" class="loot-item">🧪 +5,000</div>
        </div>
      </div>
      <div class="dialog-footer" style="justify-content: center;">
        <button id="btn-return-village" class="btn-clash btn-attack">Return to Village</button>
      </div>
    </dialog>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
